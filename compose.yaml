services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # php-fpm n'écoute qu'une fois composer install et les migrations terminés
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
      start_interval: 2s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  database:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-penderie}
      MARIADB_USER: ${MARIADB_USER:-penderie}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-penderie}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DATABASE_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - database

volumes:
  database_data:
